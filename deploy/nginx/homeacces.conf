# /etc/nginx/sites-available/homeacces
# Serves the React build and proxies /api to gunicorn on the Unix socket /run/homeacces-api.sock
# (created by homeacces.socket, connectable only by www-data).

limit_req_zone $binary_remote_addr zone=homeacces_auth:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=homeacces_ws:1m;

upstream homeacces_api {
    server unix:/run/homeacces-api.sock;
    keepalive 8;
}

upstream homeacces_terminal {
    server 127.0.0.1:8001;
}

upstream homeacces_ssh {
    server 127.0.0.1:8002;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # Self-signed by install.sh; replace with a real certificate (e.g. certbot) if public.
    ssl_certificate     /etc/ssl/homeacces/homeacces.crt;
    ssl_certificate_key /etc/ssl/homeacces/homeacces.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:homeacces_ssl:1m;

    root /var/www/homeacces;
    index index.html;

    server_tokens off;
    client_max_body_size 64k;

    include /etc/nginx/snippets/homeacces-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Brute-force throttling on password checks, in addition to the app's own checks.
    location ~ ^/api/auth/(login|register|token|password)$ {
        limit_req zone=homeacces_auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/homeacces-proxy.conf;
    }

    # Web terminal (homeacces-privd). Authenticated by a single-use ticket sent inside the socket.
    location = /api/terminal/ws {
        limit_conn homeacces_ws 8;
        proxy_pass http://homeacces_terminal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # SSH terminal (homeacces-ssh), same ticket scheme. Shares the per-IP WebSocket limit.
    location = /api/ssh/ws {
        limit_conn homeacces_ws 8;
        proxy_pass http://homeacces_ssh;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        include /etc/nginx/snippets/homeacces-proxy.conf;
    }

    # Vite emits content-hashed file names, so assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/homeacces-headers.conf;
        try_files $uri =404;
    }

    # Client-side routing: unknown paths fall back to the SPA.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/homeacces-headers.conf;
        try_files $uri /index.html;
    }
}
